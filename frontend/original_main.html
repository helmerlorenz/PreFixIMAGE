<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iMAGE — Image Denoiser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --fg:#f5f5f5; --muted:#9a9a9a; --line:#1f1f1f; --card:#050505;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg);font-family:'Hind',system-ui,sans-serif;min-height:100%}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{height:72px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--line);flex:none}
  .logo{font-family:'Archivo Black','Arial Black',sans-serif;font-size:24px;letter-spacing:-.5px;color:#fff;cursor:pointer;user-select:none}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
  .screen{display:none;width:100%}
  .screen.active{display:block}

  /* Landing */
  #landing{text-align:center}
  #landing h1{font-family:'Archivo Black','Arial Black',sans-serif;font-size:clamp(64px,9vw,92px);letter-spacing:-2px;line-height:1;margin-bottom:28px}
  #landing p{color:var(--muted);font-size:18px;font-weight:500;margin-bottom:44px}
  .btn-outline{width:240px;height:58px;background:transparent;border:1px solid #555;color:#fff;border-radius:10px;font:700 16px 'Hind',sans-serif;cursor:pointer;transition:.2s}
  .btn-outline:hover{background:#fff;color:#000;border-color:#fff}

  /* Upload */
  .drop{position:relative;width:min(767px,100%);height:405px;margin:0 auto;border:1px solid #262626;border-radius:var(--radius);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.2s}
  .drop.over{border-color:#fff;background:#0b0b0b}
  .drop h2{font-size:23px;font-weight:700;margin-bottom:38px;text-align:center;padding:0 16px}
  .icon-tile{width:80px;height:80px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:32px}
  .icon-tile svg{width:38px;height:38px}
  .row{display:flex;gap:12px}
  .btn{height:48px;padding:0 18px;border:0;border-radius:10px;background:#f5f5f5;color:#000;font:600 16px 'Hind',sans-serif;cursor:pointer;transition:.15s}
  .btn:hover{background:#fff;transform:translateY(-1px)}
  .btn.wide{width:176px}
  .hint{margin-top:32px;font-size:13px;color:var(--muted)}
  .drop .inner{display:flex;flex-direction:column;align-items:center;transition:opacity .25s}
  .drop.busy .inner{opacity:.08;pointer-events:none}
  .overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
  .drop.busy .overlay{display:flex}
  .spinner{width:44px;height:44px;border-radius:50%;border:3px solid #222;border-top-color:#fff;animation:spin .8s linear infinite;margin-bottom:22px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .overlay .label{font-weight:700;font-size:15px;margin-bottom:22px}
  .bar{width:256px;height:6px;background:#1a1a1a;border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .2s}
  .overlay .pct{font-size:13px;color:#bbb;margin-top:22px}

  /* Results */
  #results{max-width:1152px;margin:0 auto;padding-top:8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:40px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
  .card{border:1px solid #232323;border-radius:var(--radius);background:var(--card);padding:24px}
  .card h3{text-align:center;font-size:18px;font-weight:700;margin-bottom:22px}
  .imgbox{background:#050505;border-radius:10px;display:flex;align-items:center;justify-content:center;height:296px;overflow:hidden}
  .imgbox canvas,.imgbox img{max-width:100%;max-height:100%;border-radius:10px;display:block}
  .actions{display:flex;justify-content:center;gap:10px;margin-top:20px}
  .pill{height:32px;padding:0 20px;border:0;border-radius:10px;background:#f5f5f5;color:#000;font:700 13px 'Hind',sans-serif;cursor:pointer}
  .pill:hover{background:#fff}
  .metrics{display:flex;flex-direction:column;justify-content:center;gap:26px;height:296px;margin-top:6px}
  .m-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px}
  .m-bar,.p-bar{height:12px;background:#171717;border-radius:99px;overflow:hidden}
  .m-bar i,.p-bar i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
  .p-bar{height:8px;margin-top:20px}
  .p-bar i{transition:width linear}
  .status{font-size:11px;font-weight:700;margin-top:10px}
  .model .imgbox{height:240px}
  .again{display:flex;justify-content:center;margin:40px 0 24px}
  @media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo" id="home">iMAGE</div></header>
<main>

  <!-- Landing -->
  <section class="screen active" id="landing">
    <h1>iMAGE</h1>
    <p>The Image denoiser that works 3 times like a charm</p>
    <button class="btn-outline" id="begin">Begin</button>
  </section>

  <!-- Upload -->
  <section class="screen" id="upload">
    <div class="drop" id="drop">
      <div class="inner">
        <h2>Drag and Drop the Image you want to denoise</h2>
        <div class="icon-tile">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"/>
            <path d="M16 5h6M19 2v6"/>
            <circle cx="9" cy="9" r="2"/>
            <path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>
          </svg>
        </div>
        <div class="row">
          <button class="btn wide" id="uploadBtn">Upload</button>
          <button class="btn" id="sampleBtn">Try Sample Image</button>
        </div>
        <div class="hint">or press Ctrl/Cmd + V to paste an image</div>
      </div>
      <div class="overlay">
        <div class="spinner"></div>
        <div class="label">Uploading image...</div>
        <div class="bar"><i id="upBar"></i></div>
        <div class="pct" id="upPct">0%</div>
      </div>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
  </section>

  <!-- Results -->
  <section class="screen" id="results">
    <div class="grid2">
      <div class="card">
        <h3>Original</h3>
        <div class="imgbox"><canvas id="origCanvas"></canvas></div>
        <div class="actions">
          <button class="pill" data-act="copy">Copy</button>
          <button class="pill" data-act="save">Save</button>
          <button class="pill" data-act="share">Share</button>
        </div>
      </div>
      <div class="card">
        <h3>Validation — Level of Denoising</h3>
        <div class="metrics" id="metrics"></div>
      </div>
    </div>
    <div class="grid3" id="models"></div>
    <div class="again"><button class="btn" id="again">Denoise another image</button></div>
  </section>

</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const show = id => {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    window.scrollTo(0, 0);
  };

  /* Models: each gets a different blur strength / detail retention.
     Swap `run` with a fetch() to your real inference backend. */
  const MODELS = [
    { key: 'restormer', name: 'Restormer Model', radius: 2, mix: 0.92, delay: 5200 },
    { key: 'dncnn',     name: 'DnCNN Model',     radius: 1, mix: 0.84, delay: 2800 },
    { key: 'nafnet',    name: 'NAFNet Model',    radius: 2, mix: 0.80, delay: 4100 },
  ];

  let original = null; // canvas holding the working copy

  /* ---------- Navigation ---------- */
  $('#begin').onclick = () => show('upload');
  $('#home').onclick = () => show('landing');
  $('#again').onclick = () => { resetUpload(); show('upload'); };

  /* ---------- Input handling ---------- */
  $('#uploadBtn').onclick = () => $('#file').click();
  $('#file').onchange = e => e.target.files[0] && handleFile(e.target.files[0]);
  $('#sampleBtn').onclick = () => startFromCanvas(makeSample());

  const drop = $('#drop');
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) handleFile(f); });
  window.addEventListener('paste', e => {
    if (!$('#upload').classList.contains('active')) return;
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (item) handleFile(item.getAsFile());
  });

  function handleFile(file) {
    if (!file.type.startsWith('image/')) return alert('Please choose an image file.');
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      const max = 512, s = Math.min(1, max / Math.max(img.width, img.height));
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      startFromCanvas(c);
    };
    img.src = URL.createObjectURL(file);
  }

  function resetUpload() {
    drop.classList.remove('busy');
    $('#upBar').style.width = '0%'; $('#upPct').textContent = '0%';
    $('#file').value = '';
  }

  /* ---------- Fake upload progress, then process ---------- */
  function startFromCanvas(canvas) {
    original = canvas;
    drop.classList.add('busy');
    let p = 0;
    const t = setInterval(() => {
      p = Math.min(100, p + 4 + Math.random() * 9);
      $('#upBar').style.width = p + '%';
      $('#upPct').textContent = Math.round(p) + '%';
      if (p >= 100) { clearInterval(t); setTimeout(() => { buildResults(); show('results'); resetUpload(); }, 250); }
    }, 110);
  }

  /* ---------- Results ---------- */
  function buildResults() {
    const oc = $('#origCanvas');
    oc.width = original.width; oc.height = original.height;
    oc.getContext('2d').drawImage(original, 0, 0);

    $('#metrics').innerHTML = MODELS.map(m => `
      <div><div class="m-top"><span>${m.name}</span><span id="pct-${m.key}">— </span></div>
      <div class="m-bar"><i id="mbar-${m.key}"></i></div></div>`).join('');

    $('#models').innerHTML = MODELS.map(m => `
      <div class="card model">
        <h3>${m.name}</h3>
        <div class="imgbox"><canvas id="c-${m.key}"></canvas></div>
        <div class="p-bar"><i id="pbar-${m.key}"></i></div>
        <div class="status" id="st-${m.key}">Processing…</div>
      </div>`).join('');

    const sigmaIn = estimateNoise(original);
    MODELS.forEach(m => {
      const start = performance.now();
      requestAnimationFrame(() => { const b = $('#pbar-' + m.key); b.style.transitionDuration = m.delay + 'ms'; b.style.width = '100%'; });
      setTimeout(() => {
        const out = denoise(original, m.radius, m.mix);
        const c = $('#c-' + m.key);
        c.width = out.width; c.height = out.height;
        c.getContext('2d').drawImage(out, 0, 0);
        const sigmaOut = estimateNoise(out);
        const pct = Math.max(0, Math.min(99, Math.round((1 - sigmaOut / Math.max(sigmaIn, 1e-6)) * 100)));
        $('#pct-' + m.key).textContent = pct + '% denoised';
        $('#mbar-' + m.key).style.width = pct + '%';
        $('#st-' + m.key).textContent = 'Done in ' + ((performance.now() - start) / 1000).toFixed(1) + 's';
      }, m.delay);
    });
  }

  /* ---------- Denoising (client-side stand-in) ---------- */
  function denoise(src, radius, mix) {
    const w = src.width, h = src.height;
    const ctx = src.getContext('2d');
    const d = ctx.getImageData(0, 0, w, h);
    const blurred = boxBlur(d, w, h, radius, 2);
    const out = new ImageData(w, h);
    for (let i = 0; i < d.data.length; i += 4) {
      for (let k = 0; k < 3; k++) out.data[i + k] = blurred[i + k] * mix + d.data[i + k] * (1 - mix);
      out.data[i + 3] = 255;
    }
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').putImageData(out, 0, 0);
    return c;
  }

  function boxBlur(imgData, w, h, r, passes) {
    let a = Float32Array.from(imgData.data), b = new Float32Array(a.length);
    for (let p = 0; p < passes; p++) {
      // horizontal
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        let n = 0, s0 = 0, s1 = 0, s2 = 0;
        for (let k = -r; k <= r; k++) { const xx = Math.min(w - 1, Math.max(0, x + k)), i = (y * w + xx) * 4; s0 += a[i]; s1 += a[i + 1]; s2 += a[i + 2]; n++; }
        const o = (y * w + x) * 4; b[o] = s0 / n; b[o + 1] = s1 / n; b[o + 2] = s2 / n; b[o + 3] = 255;
      }
      // vertical
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        let n = 0, s0 = 0, s1 = 0, s2 = 0;
        for (let k = -r; k <= r; k++) { const yy = Math.min(h - 1, Math.max(0, y + k)), i = (yy * w + x) * 4; s0 += b[i]; s1 += b[i + 1]; s2 += b[i + 2]; n++; }
        const o = (y * w + x) * 4; a[o] = s0 / n; a[o + 1] = s1 / n; a[o + 2] = s2 / n; a[o + 3] = 255;
      }
    }
    return a;
  }

  // Immerkaer fast noise-variance estimator on luminance
  function estimateNoise(canvas) {
    const w = canvas.width, h = canvas.height;
    const d = canvas.getContext('2d').getImageData(0, 0, w, h).data;
    const L = new Float32Array(w * h);
    for (let i = 0; i < L.length; i++) L[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
    let sum = 0;
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const v = L[i-w-1] - 2*L[i-w] + L[i-w+1] - 2*L[i-1] + 4*L[i] - 2*L[i+1] + L[i+w-1] - 2*L[i+w] + L[i+w+1];
      sum += Math.abs(v);
    }
    return sum * Math.sqrt(Math.PI / 2) / (6 * (w - 2) * (h - 2));
  }

  /* ---------- Sample image: noisy night street ---------- */
  function makeSample() {
    const w = 480, h = 480, c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    const sky = g.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#0b0907'); sky.addColorStop(.6, '#1a120a'); sky.addColorStop(1, '#060504');
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    // buildings
    g.fillStyle = '#0d0b09'; g.fillRect(0, 60, 130, 330);
    g.fillStyle = '#12100d'; g.fillRect(300, 140, 180, 250);
    for (let i = 0; i < 26; i++) {
      g.fillStyle = Math.random() > .5 ? '#e8d9b0' : '#b38a3c';
      g.globalAlpha = .5 + Math.random() * .5;
      g.fillRect(320 + (i % 5) * 32, 160 + Math.floor(i / 5) * 36, 10, 16);
    }
    g.globalAlpha = 1;
    // road + wet reflections
    g.fillStyle = '#0a0907'; g.fillRect(0, 380, w, 100);
    // street lamp glow
    const glow = (x, y, r, col) => { const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'transparent'); g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2); };
    glow(190, 130, 90, 'rgba(255,190,90,.75)');
    g.fillStyle = '#2a2217'; g.fillRect(187, 135, 5, 260);
    g.fillStyle = '#ffd9a0'; g.beginPath(); g.arc(190, 130, 6, 0, 7); g.fill();
    for (let i = 0; i < 18; i++) glow(40 + Math.random() * 400, 330 + Math.random() * 50, 14 + Math.random() * 14, Math.random() > .5 ? 'rgba(255,120,40,.8)' : 'rgba(255,220,150,.7)');
    glow(190, 440, 70, 'rgba(255,170,70,.35)');
    // noise
    const d = g.getImageData(0, 0, w, h), px = d.data;
    for (let i = 0; i < px.length; i += 4) {
      const n = (Math.random() + Math.random() + Math.random() - 1.5) * 46;
      px[i] = Math.max(0, Math.min(255, px[i] + n));
      px[i + 1] = Math.max(0, Math.min(255, px[i + 1] + n * .9));
      px[i + 2] = Math.max(0, Math.min(255, px[i + 2] + n * 1.1));
    }
    g.putImageData(d, 0, 0);
    return c;
  }

  /* ---------- Copy / Save / Share ---------- */
  const toBlob = () => new Promise(r => $('#origCanvas').toBlob(r, 'image/png'));
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    const act = b.dataset.act, blob = await toBlob(), label = b.textContent;
    const flash = t => { b.textContent = t; setTimeout(() => b.textContent = label, 1200); };
    if (act === 'copy') {
      try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); flash('Copied'); }
      catch { flash('Failed'); }
    } else if (act === 'save') {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'image.png'; a.click(); flash('Saved');
    } else {
      const file = new File([blob], 'image.png', { type: 'image/png' });
      if (navigator.canShare?.({ files: [file] })) navigator.share({ files: [file], title: 'iMAGE' }).catch(() => {});
      else { try { await navigator.clipboard.writeText(location.href); flash('Link copied'); } catch { flash('Unsupported'); } }
    }
  });
})();
</script>
</body>
</html>
